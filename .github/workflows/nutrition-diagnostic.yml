name: Nutrition diagnostic (temporary)

on:
  push:
    branches: [test/m4.8-nutrition-diagnostic]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 80
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Run unchanged three-tap and companion assertions
        timeout-minutes: 30
        # Diagnostic-only native tail of test-ios.sh. Intentional DEBUG structural
        # logging is incompatible with production's zero-log gate. ios.yml and all
        # production verifiers remain unchanged and must pass after trace removal.
        # Success here is test/capture evidence, never privacy or M4 acceptance.
        run: |
          set -euo pipefail
          scripts/bootstrap.sh
          destination="$(scripts/select-simulator.sh)"
          mkdir -p .build
          xcodebuild test \
            -project HealthTrackingApp.xcodeproj \
            -scheme HealthTrackingApp-Local \
            -only-testing:HealthTrackingAppUITests/NutritionQuickAddUITests \
            -destination "$destination" \
            -resultBundlePath "$PWD/.build/HealthTrackingApp.xcresult" \
            CODE_SIGNING_ALLOWED=NO
          xcodebuild build \
            -project HealthTrackingApp.xcodeproj \
            -scheme HealthTrackingApp-Local \
            -configuration Release \
            -destination "$destination" \
            CODE_SIGNING_ALLOWED=NO
      - name: Export bounded diagnostic trace
        if: always()
        run: |
          set -euo pipefail
          mkdir -p .build/nutrition-diagnostic
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          output = Path(".build/nutrition-diagnostic")
          devices = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "--json"], text=True
          ))
          (output / "simulators.json").write_text(json.dumps(devices, indent=2))
          result_root = json.loads(subprocess.check_output([
              "xcrun", "xcresulttool", "get", "object", "--legacy", "--format", "json",
              "--path", ".build/HealthTrackingApp.xcresult",
          ], text=True))
          test_devices = set()
          for action in result_root["actions"]["_values"]:
              target = action["runDestination"]["targetDeviceRecord"]
              if target["platformRecord"]["identifier"]["_value"] == "com.apple.platform.iphonesimulator":
                  test_devices.add(target["identifier"]["_value"])
          (output / "test-destinations.json").write_text(json.dumps(sorted(test_devices)))
          observed = {}
          for runtime, candidates in devices["devices"].items():
              for device in candidates:
                  simulator_id = device["udid"]
                  if device.get("state") != "Booted":
                      if simulator_id not in test_devices:
                          continue
                      # Xcode shuts down the tested device before the Release build finishes.
                      # Boot only an exact xcresult-proven destination to read its retained log.
                      subprocess.run(["xcrun", "simctl", "boot", simulator_id], check=True)
                      subprocess.run(["xcrun", "simctl", "bootstatus", simulator_id, "-b"], check=True)
                  result = subprocess.run([
                      "xcrun", "simctl", "spawn", simulator_id, "log", "show",
                      "--last", "35m", "--style", "json", "--predicate",
                      'subsystem == "com.fatihzxc.HealthTrackingApp.NutritionDiagnostic"',
                  ], text=True, capture_output=True)
                  (output / f"{simulator_id}-trace.json").write_text(result.stdout)
                  (output / f"{simulator_id}-capture.txt").write_text(
                      f"runtime={runtime} simulator={simulator_id} exit={result.returncode}\n"
                      + result.stderr
                  )
                  if result.returncode:
                      continue
                  for entry in json.loads(result.stdout):
                      message = entry.get("eventMessage", "")
                      if "flow=persistent" not in message:
                          continue
                      key = (simulator_id, entry.get("processID"))
                      observed.setdefault(key, set()).add(message.split("event=", 1)[-1])
          # The original failing three-tap test alone uses the persistent-store flag.
          # Require positive telemetry for that flow/PID before interpreting missing actions.
          proven = [key for key, events in observed.items()
                    if key[1] is not None and {"begin-entry", "begin-selecting"} <= events]
          if not proven:
              raise SystemExit("Missing positive three-tap begin trace; capture is inconclusive.")
          print("Positive three-tap trace captured for simulator/PID:", proven)
          PY
      - name: Export test attachments
        if: always()
        run: |
          xcrun xcresulttool export attachments \
            --path .build/HealthTrackingApp.xcresult \
            --output-path .build/nutrition-diagnostic/attachments
      - name: Replay the unchanged first case up to ten times, stopping on failure
        timeout-minutes: 25
        run: |
          set -euo pipefail
          mkdir -p .build/nutrition-replay
          date -u '+%Y-%m-%d %H:%M:%S+0000' > .build/nutrition-replay/start-utc.txt
          date '+%Z %z' > .build/nutrition-replay/host-timezone.txt
          xcodebuild -version > .build/nutrition-replay/xcode-version.txt
          xcrun xcresulttool version > .build/nutrition-replay/xcresulttool-version.txt
          destination="$(scripts/select-simulator.sh)"
          xcodebuild test \
            -project HealthTrackingApp.xcodeproj \
            -scheme HealthTrackingApp-Local \
            -destination "$destination" \
            -resultBundlePath .build/NutritionWarm.xcresult \
            -only-testing:HealthTrackingAppUITests/NutritionQuickAddUITests/testCategoryRecipeAndDefaultConfirmAreExactlyThreeTapsAndPersistAfterRelaunch \
            -test-iterations 10 -run-tests-until-failure \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee .build/nutrition-replay/xcodebuild.log
      - name: Correlate every attempted replay with its own app trace
        if: always() && hashFiles('.build/nutrition-replay/start-utc.txt') != ''
        timeout-minutes: 10
        run: python3 .github/scripts/nutrition_replay_capture.py
      - name: Export replay attachments
        if: always() && hashFiles('.build/NutritionWarm.xcresult/Info.plist') != ''
        run: |
          xcrun xcresulttool export attachments \
            --path .build/NutritionWarm.xcresult \
            --output-path .build/nutrition-replay/attachments
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nutrition-quick-add-diagnostic
          path: |
            .build/nutrition-diagnostic
            .build/HealthTrackingApp.xcresult
            .build/nutrition-replay
            .build/NutritionWarm.xcresult
          if-no-files-found: error
