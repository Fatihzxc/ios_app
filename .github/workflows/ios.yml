name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Tool versions
        run: |
          xcodebuild -version
          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen --version
          else
            echo "xcodegen: not installed"
          fi

      - name: Install compatible XcodeGen
        run: |
          required_version="2.46.0"
          version_at_least() {
            local actual="$1"
            local required="$2"
            local actual_major actual_minor actual_patch required_major required_minor required_patch
            IFS=. read -r actual_major actual_minor actual_patch <<< "$actual"
            IFS=. read -r required_major required_minor required_patch <<< "$required"
            actual_minor="${actual_minor:-0}"
            actual_patch="${actual_patch:-0}"
            required_minor="${required_minor:-0}"
            required_patch="${required_patch:-0}"
            (( actual_major > required_major )) ||
              (( actual_major == required_major && actual_minor > required_minor )) ||
              (( actual_major == required_major && actual_minor == required_minor && actual_patch >= required_patch ))
          }

          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          else
            version_output="$(xcodegen --version)"
            version="$(printf '%s\n' "$version_output" | grep -Eo '[0-9]+(\.[0-9]+){1,2}' | head -n 1)"
            if [[ -z "$version" ]] || ! version_at_least "$version" "$required_version"; then
              brew upgrade xcodegen
            fi
          fi

          version_output="$(xcodegen --version)"
          version="$(printf '%s\n' "$version_output" | grep -Eo '[0-9]+(\.[0-9]+){1,2}' | head -n 1)"
          if [[ -z "$version" ]] || ! version_at_least "$version" "$required_version"; then
            echo "xcodegen ${required_version} or newer is required; found: ${version_output}" >&2
            exit 1
          fi
          printf '%s\n' "$version_output"

      - name: M0 acceptance gates
        run: |
          scripts/verify-localization.sh --self-test
          scripts/verify-localization.sh
          scripts/verify-requirements.sh --self-test
          scripts/verify-requirements.sh
          scripts/verify-today.sh --self-test
          scripts/verify-today.sh
          scripts/verify-haptics.sh --self-test
          scripts/verify-haptics.sh
          scripts/verify-nutrition.sh --self-test
          scripts/verify-nutrition.sh
          scripts/verify-trackers.sh --self-test
          scripts/verify-trackers.sh

      - name: Fresh-clone bootstrap idempotence
        timeout-minutes: 15
        run: scripts/test-ios.sh --verify-bootstrap-idempotence

      - name: Targeted M3.6 bloodwork reference tests
        timeout-minutes: 20
        run: scripts/test-ios.sh --only-testing HealthChecksKitTests

      - name: Targeted M3.7-M3.9 photo lifecycle, gallery, and cloud asset tests
        timeout-minutes: 20
        # ProgressPhotoLifecycleUITests remains in the complete app suite below.
        run: scripts/test-ios.sh --only-testing ProgressPhotosKitTests

      - name: Targeted M3.10 medical safety tests
        timeout-minutes: 20
        run: scripts/test-ios.sh --only-testing HealthSafetyKitTests

      - name: Test iOS app
        timeout-minutes: 90
        # The dedicated test-cold-launch job owns this noisy performance gate.
        # Keep the complete functional suite here without executing it twice.
        run: scripts/test-ios.sh --skip-testing HealthTrackingAppUITests/TodayGuidanceUITests/testColdLaunchPublishesFirstMeaningfulDirectiveWithinOneSecondMedian

      - name: Export screenshot evidence
        timeout-minutes: 10
        run: |
          set -euo pipefail
          result_bundle=".build/HealthTrackingApp.xcresult"
          export_directory=".build/gallery-screenshots"

          test -d "$result_bundle"
          rm -rf "$export_directory"
          mkdir -p "$export_directory"
          xcrun xcresulttool help export attachments
          xcrun xcresulttool export attachments --path "$result_bundle" --output-path "$export_directory"

          python3 - "$export_directory" <<'PY'
          import json
          import shutil
          import sys
          from pathlib import Path

          export_directory = Path(sys.argv[1])
          manifest_path = export_directory / "manifest.json"
          if not manifest_path.is_file():
              raise SystemExit(f"Missing attachment manifest: {manifest_path}")
          try:
              manifest = json.loads(manifest_path.read_text())
          except (OSError, UnicodeError, json.JSONDecodeError) as error:
              raise SystemExit(f"Invalid attachment manifest {manifest_path}: {error}") from error
          if not isinstance(manifest, list):
              raise SystemExit("Attachment manifest root must be a list of test records.")

          shell_expected = {
              "shell-today-light",
              "shell-training-light",
              "shell-nutrition-light",
              "shell-progress-light",
              "shell-settings-light",
              "shell-today-dark",
              "shell-training-dark",
              "shell-nutrition-dark",
              "shell-progress-dark",
              "shell-settings-dark",
              "shell-loading",
              "shell-empty",
              "shell-error",
              "shell-fatal",
              "shell-settings-gallery",
              "shell-settings-path-isolation",
          }
          gallery_expected = {"gallery-light", "gallery-dark"}
          accessibility_expected = {"accessibility-xxxl-light", "accessibility-xxxl-dark"}
          today_expected = {
              f"today-{variant}-{appearance}-{size}"
              for variant in ["train", "rest", "resume", "deload", "phase", "reminder"]
              for appearance in ["light", "dark"]
              for size in ["standard", "accessibility"]
          }
          training_accessibility_expected = {
              f"m1-session-{appearance}-{size}"
              for appearance in ["light", "dark"]
              for size in ["default", "xxl", "ax3", "ax5"]
          } | {
              "m1-session-reduce-motion",
              "m1-session-high-contrast",
          }
          m1_acceptance_expected = {
              "m1-acceptance-catalog",
              "m1-acceptance-progression-safety",
              "m1-acceptance-personal-records",
              "m1-acceptance-haptics-disabled",
          }
          nutrition_day_expected = {
              "nutrition-day-content-light",
              "nutrition-day-content-dark",
              "nutrition-day-content-ax5",
              "nutrition-day-empty-light",
              "nutrition-day-error-dark",
              "nutrition-day-reduce-motion-light",
              "nutrition-day-high-contrast-dark",
          }
          nutrition_quick_add_expected = {
              "nutrition-quick-add-saved-light",
              "nutrition-quick-add-select-dark",
              "nutrition-quick-add-confirm-ax5",
          }
          m2_acceptance_expected = {
              "m2-acceptance-recipe-history",
              "m2-acceptance-mixed-sources",
          }
          nutrition_accessibility_expected = {
              "m2-nutrition-ax5-adhoc",
              "m2-nutrition-dark-high-contrast-food",
              "m2-nutrition-reduce-motion",
          }
          body_metric_expected = {
              "m3-metrics-progress-light",
              "m3-metrics-entry-dark",
              "m3-metrics-entry-ax5",
          }
          lifestyle_expected = {
              "m3-lifestyle-combined-light",
              "m3-lifestyle-progress-light",
              "m3-lifestyle-entry-dark",
              "m3-lifestyle-entry-ax5",
          }
          posture_expected = {
              "m3-posture-entry-light",
              "m3-posture-progress-light",
              "m3-posture-entry-dark",
              "m3-posture-entry-ax5",
              "m3-posture-high-contrast",
          }
          ohp_safety_expected = {
              "session-ohp-prior-question-light",
              "session-ohp-blocked-light",
              "session-ohp-half-kneeling-alternative-light",
          }
          health_check_expected = {
              "m3-health-check-completed-light",
              "m3-health-check-progress-light",
              "m3-health-check-detail-ax5",
          }
          bloodwork_expected = {
              "m3-bloodwork-empty-light",
              "m3-bloodwork-detail-light",
              "m3-bloodwork-editor-dark-high-contrast",
              "m3-bloodwork-editor-ax5",
          }
          expected = (
              shell_expected
              | gallery_expected
              | accessibility_expected
              | today_expected
              | training_accessibility_expected
              | m1_acceptance_expected
              | nutrition_day_expected
              | nutrition_quick_add_expected
              | m2_acceptance_expected
              | nutrition_accessibility_expected
              | body_metric_expected
              | lifestyle_expected
              | posture_expected
              | ohp_safety_expected
              | health_check_expected
              | bloodwork_expected
          )

          owners = {
              "AppShellUITests": {
                  "module": "HealthTrackingAppUITests",
                  "expected": shell_expected,
              },
              "GalleryScreenshotTests": {
                  "module": "DesignSystemTests",
                  "expected": gallery_expected,
              },
              "AccessibilitySmokeUITests": {
                  "module": "HealthTrackingAppUITests",
                  "expected": accessibility_expected,
              },
              "TodayGuidanceUITests": {
                  "module": "HealthTrackingAppUITests",
                  "expected": today_expected,
              },
              "TrainingAccessibilityUITests": {
                  "module": "HealthTrackingAppUITests",
                  "expected": training_accessibility_expected,
              },
              "M1AcceptanceUITests": {
                  "module": "HealthTrackingAppUITests",
                  "expected": m1_acceptance_expected,
              },
              "NutritionDayUITests": {
                  "module": "HealthTrackingAppUITests",
                  "expected": nutrition_day_expected,
              },
              "NutritionQuickAddUITests": {
                  "module": "HealthTrackingAppUITests",
                  "expected": nutrition_quick_add_expected,
              },
              "M2AcceptanceUITests": {
                  "module": "HealthTrackingAppUITests",
                  "expected": m2_acceptance_expected,
              },
              "NutritionAccessibilityUITests": {
                  "module": "HealthTrackingAppUITests",
                  "expected": nutrition_accessibility_expected,
              },
              "BodyMetricFlowUITests": {
                  "module": "HealthTrackingAppUITests",
                  "expected": body_metric_expected,
              },
              "LifestyleFlowUITests": {
                  "module": "HealthTrackingAppUITests",
                  "expected": lifestyle_expected,
              },
              "PostureFlowUITests": {
                  "module": "HealthTrackingAppUITests",
                  "expected": posture_expected,
              },
              "OHPSafetyFlowUITests": {
                  "module": "HealthTrackingAppUITests",
                  "expected": ohp_safety_expected,
              },
              "HealthCheckFlowUITests": {
                  "module": "HealthTrackingAppUITests",
                  "expected": health_check_expected,
              },
              "BloodworkFlowUITests": {
                  "module": "HealthTrackingAppUITests",
                  "expected": bloodwork_expected,
              },
          }

          def identifier_matches_owner(test_identifier, module, test_case):
              segments = test_identifier.split("/")
              if any(not segment for segment in segments) or not segments[-1].startswith("test"):
                  return False
              if len(segments) == 2:
                  class_segment = segments[0]
                  return class_segment in {test_case, f"{module}.{test_case}"}
              if len(segments) == 3:
                  return segments[0] == module and segments[1] == test_case
              return False

          def records_by_owner():
              records = {test_case: [] for test_case in owners}
              for record in manifest:
                  if not isinstance(record, dict):
                      raise SystemExit("Every attachment manifest record must be an object.")
                  test_identifier = record.get("testIdentifier")
                  if not isinstance(test_identifier, str):
                      raise SystemExit("Every attachment manifest record must have a string testIdentifier.")
                  matching_owners = [
                      test_case
                      for test_case, owner in owners.items()
                      if identifier_matches_owner(test_identifier, owner["module"], test_case)
                  ]
                  if len(matching_owners) > 1:
                      raise SystemExit(
                          f"Ambiguous attachment owner for {test_identifier}: {matching_owners}"
                      )
                  if matching_owners:
                      attachments = record.get("attachments")
                      if not isinstance(attachments, list):
                          raise SystemExit(f"Invalid attachments list for {test_identifier}.")
                      records[matching_owners[0]].append(record)
              for test_case, test_records in records.items():
                  if not test_records:
                      raise SystemExit(f"Missing {test_case} attachment record.")
              return records

          owned_records = records_by_owner()
          exported = {}
          supported_extensions = {".png", ".jpg", ".jpeg"}

          for test_case, test_records in owned_records.items():
              owner_expected = owners[test_case]["expected"]
              for record in test_records:
                  test_identifier = record["testIdentifier"]
                  for attachment in record["attachments"]:
                      if not isinstance(attachment, dict):
                          raise SystemExit(f"Invalid attachment entry for {test_identifier}.")
                      suggested_name = attachment.get("suggestedHumanReadableName")
                      exported_file_name = attachment.get("exportedFileName")
                      if not isinstance(suggested_name, str) or not isinstance(exported_file_name, str):
                          raise SystemExit(f"Invalid attachment metadata for {test_identifier}.")

                      normalized_name = suggested_name.lower()
                      matches = sorted(
                          canonical
                          for canonical in expected
                          if normalized_name == canonical or normalized_name.startswith(f"{canonical}_")
                      )
                      if len(matches) > 1:
                          raise SystemExit(
                              f"Ambiguous canonical attachment mapping for {suggested_name!r}: {matches}"
                          )
                      if not matches:
                          continue

                      canonical = matches[0]
                      if canonical not in owner_expected:
                          raise SystemExit(
                              f"Canonical attachment {canonical} belongs to a different test owner, "
                              f"not {test_case}."
                          )
                      if canonical in exported:
                          raise SystemExit(
                              f"Duplicate canonical attachment mapping for {canonical}: "
                              f"{exported[canonical][1]} and {exported_file_name}"
                          )

                      source = export_directory / exported_file_name
                      extension = source.suffix.lower()
                      if not source.is_file():
                          raise SystemExit(f"Missing source image for {canonical}: {source}")
                      if extension not in supported_extensions:
                          raise SystemExit(f"Unsupported image extension for {canonical}: {source}")

                      destination = export_directory / f"{canonical}{extension}"
                      shutil.copyfile(source, destination)
                      exported[canonical] = (destination.name, source.name)

          missing = sorted(expected - set(exported))
          if missing:
              raise SystemExit(f"Missing canonical screenshot attachments: {missing}")

          (export_directory / "manifest.tsv").write_text(
              "".join(
                  f"{canonical}\t{exported[canonical][0]}\tsource={exported[canonical][1]}\n"
                  for canonical in sorted(expected)
              )
          )
          PY
          find "$export_directory" -maxdepth 1 -type f -print | sort

      - name: Cloud scheme compile-only
        timeout-minutes: 20
        run: scripts/test-ios.sh --cloud-compile-only

      - name: Repository hygiene
        run: |
          set -euo pipefail
          git show --check --format= HEAD
          git diff --check
          tracked_changes="$(git status --short --untracked-files=no)"
          if [[ -n "$tracked_changes" ]]; then
            echo "Tracked files changed during acceptance:" >&2
            printf '%s\n' "$tracked_changes" >&2
            exit 1
          fi
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          patterns = {
              "private key": re.compile(r"BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY"),
              "AWS access key": re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              "assigned secret": re.compile(
                  r"(?i)\b(?:api[_-]?key|client[_-]?secret|access[_-]?token)\b\s*[:=]\s*[\"'][^\"'${}\s][^\"']*[\"']"
              ),
          }
          files = subprocess.run(
              ["git", "ls-files", "-z"], check=True, stdout=subprocess.PIPE
          ).stdout.split(b"\0")
          findings = []
          for encoded_path in files:
              if not encoded_path:
                  continue
              path = Path(encoded_path.decode("utf-8"))
              try:
                  text = path.read_text(encoding="utf-8")
              except (OSError, UnicodeError):
                  continue
              for label, pattern in patterns.items():
                  if pattern.search(text):
                      findings.append(f"{path}: possible {label}")
          if findings:
              raise SystemExit("\n".join(findings))
          print("Tracked secret-pattern scan passed.")
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HealthTrackingApp-xcresult
          path: |
            .build/**/*.xcresult
            .build/gallery-screenshots/**
          include-hidden-files: true
          if-no-files-found: warn

  test-cold-launch:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install compatible XcodeGen
        run: |
          required_version="2.46.0"
          version_at_least() {
            local actual="$1"
            local required="$2"
            local actual_major actual_minor actual_patch required_major required_minor required_patch
            IFS=. read -r actual_major actual_minor actual_patch <<< "$actual"
            IFS=. read -r required_major required_minor required_patch <<< "$required"
            actual_minor="${actual_minor:-0}"
            actual_patch="${actual_patch:-0}"
            required_minor="${required_minor:-0}"
            required_patch="${required_patch:-0}"
            (( actual_major > required_major )) ||
              (( actual_major == required_major && actual_minor > required_minor )) ||
              (( actual_major == required_major && actual_minor == required_minor && actual_patch >= required_patch ))
          }
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          version_output="$(xcodegen --version)"
          version="$(printf '%s\n' "$version_output" | grep -Eo '[0-9]+(\.[0-9]+){1,2}' | head -n 1)"
          if [[ -z "$version" ]] || ! version_at_least "$version" "$required_version"; then
            brew upgrade xcodegen
          fi
          xcodegen --version

      - name: Test cold launch contract with phase evidence
        timeout-minutes: 20
        run: |
          set -euo pipefail
          scripts/bootstrap.sh
          destination="$(scripts/select-simulator.sh)"
          result_bundle=".build/HealthTrackingApp-cold-launch.xcresult"
          rm -rf "$result_bundle"
          xcodebuild test \
            -project HealthTrackingApp.xcodeproj \
            -scheme HealthTrackingApp-Local \
            -destination "$destination" \
            -resultBundlePath "$result_bundle" \
            -only-testing:HealthTrackingAppUITests/TodayGuidanceUITests/testColdLaunchPublishesFirstMeaningfulDirectiveWithinOneSecondMedian \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload cold-launch test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HealthTrackingApp-cold-launch-xcresult
          path: .build/HealthTrackingApp-cold-launch.xcresult
          include-hidden-files: true
          if-no-files-found: warn

  test-small-phone:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install compatible XcodeGen
        run: |
          required_version="2.46.0"
          version_at_least() {
            local actual="$1"
            local required="$2"
            local actual_major actual_minor actual_patch required_major required_minor required_patch
            IFS=. read -r actual_major actual_minor actual_patch <<< "$actual"
            IFS=. read -r required_major required_minor required_patch <<< "$required"
            actual_minor="${actual_minor:-0}"
            actual_patch="${actual_patch:-0}"
            required_minor="${required_minor:-0}"
            required_patch="${required_patch:-0}"
            (( actual_major > required_major )) ||
              (( actual_major == required_major && actual_minor > required_minor )) ||
              (( actual_major == required_major && actual_minor == required_minor && actual_patch >= required_patch ))
          }
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          version_output="$(xcodegen --version)"
          version="$(printf '%s\n' "$version_output" | grep -Eo '[0-9]+(\.[0-9]+){1,2}' | head -n 1)"
          if [[ -z "$version" ]] || ! version_at_least "$version" "$required_version"; then
            brew upgrade xcodegen
          fi
          xcodegen --version

      - name: Test M1 on small iPhone at AX5
        timeout-minutes: 20
        run: |
          set -euo pipefail
          scripts/bootstrap.sh
          destination="$(scripts/select-simulator.sh --small)"
          result_bundle=".build/HealthTrackingApp-small.xcresult"
          rm -rf "$result_bundle"
          xcodebuild test \
            -project HealthTrackingApp.xcodeproj \
            -scheme HealthTrackingApp-Local \
            -destination "$destination" \
            -resultBundlePath "$result_bundle" \
            -only-testing:HealthTrackingAppUITests/TrainingAccessibilityUITests/testSmallPhoneAX5SessionRemainsOperable \
            CODE_SIGNING_ALLOWED=NO

      - name: Export small-phone screenshot evidence
        if: success()
        run: |
          set -euo pipefail
          result_bundle=".build/HealthTrackingApp-small.xcresult"
          export_directory=".build/small-phone-screenshots"
          rm -rf "$export_directory"
          mkdir -p "$export_directory"
          xcrun xcresulttool export attachments \
            --path "$result_bundle" \
            --output-path "$export_directory"
          python3 - "$export_directory" <<'PY'
          import json
          import shutil
          import sys
          from pathlib import Path

          export_directory = Path(sys.argv[1])
          manifest = json.loads((export_directory / "manifest.json").read_text())
          matches = []
          for record in manifest:
              identifier = record.get("testIdentifier", "")
              if "TrainingAccessibilityUITests" not in identifier:
                  continue
              for attachment in record.get("attachments", []):
                  suggested = attachment.get("suggestedHumanReadableName", "").lower()
                  if suggested == "m1-session-small-ax5" or suggested.startswith(
                      "m1-session-small-ax5_"
                  ):
                      matches.append(attachment["exportedFileName"])
          if len(matches) != 1:
              raise SystemExit(
                  f"Expected one m1-session-small-ax5 screenshot; found {matches}"
              )
          source = export_directory / matches[0]
          if source.suffix.lower() not in {".png", ".jpg", ".jpeg"}:
              raise SystemExit(f"Unsupported small-phone screenshot: {source}")
          shutil.copyfile(
              source,
              export_directory / f"m1-session-small-ax5{source.suffix.lower()}",
          )
          PY

      - name: Upload small-phone test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HealthTrackingApp-small-phone-xcresult
          path: |
            .build/HealthTrackingApp-small.xcresult
            .build/small-phone-screenshots/**
          include-hidden-files: true
          if-no-files-found: warn
