name: HealthTrackingApp
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
  Cloud Debug: debug
  Cloud Release: release
packages:
  HealthTrackingModules:
    path: Packages/HealthTrackingModules
targets:
  HealthTrackingApp:
    type: application
    platform: iOS
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    sources:
      - App
    dependencies:
      - package: HealthTrackingModules
        product: CoreModels
      - package: HealthTrackingModules
        product: TrainingKit
      - package: HealthTrackingModules
        product: PersistenceKit
      - package: HealthTrackingModules
        product: DesignSystem
      - package: HealthTrackingModules
        product: NutritionKit
      - package: HealthTrackingModules
        product: HealthSafetyKit
      - package: HealthTrackingModules
        product: HealthChecksKit
      - package: HealthTrackingModules
        product: NotificationsKit
      - package: HealthTrackingModules
        product: ProgressPhotosKit
      - package: HealthTrackingModules
        product: MetricsKit
      - package: HealthTrackingModules
        product: SleepMoodKit
      - package: HealthTrackingModules
        product: ReportsKit
      - package: HealthTrackingModules
        product: SettingsKit
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
      Cloud Debug: Config/CloudDebug.xcconfig
      Cloud Release: Config/CloudRelease.xcconfig
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Sağlık Takip
        CFBundleDevelopmentRegion: tr
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CloudKitEnabled: $(CLOUDKIT_ENABLED)
        CloudKitContainerIdentifier: $(ICLOUD_CONTAINER_IDENTIFIER)
  HealthTrackingAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - HealthTrackingAppUITests
    dependencies:
      - target: HealthTrackingApp
  HealthTrackingAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HealthTrackingAppTests
    dependencies:
      - target: HealthTrackingApp
schemes:
  HealthTrackingApp-Local:
    build:
      targets:
        HealthTrackingApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HealthTrackingAppTests
        - HealthTrackingAppUITests
        - package: HealthTrackingModules/CoreModelsTests
        - package: HealthTrackingModules/GuidanceKitTests
        - package: HealthTrackingModules/PersistenceKitTests
        - package: HealthTrackingModules/TrainingKitTests
        - package: HealthTrackingModules/DesignSystemTests
        - package: HealthTrackingModules/NutritionKitTests
        - package: HealthTrackingModules/HealthSafetyKitTests
        - package: HealthTrackingModules/HealthChecksKitTests
        - package: HealthTrackingModules/NotificationsKitTests
        - package: HealthTrackingModules/ProgressPhotosKitTests
        - package: HealthTrackingModules/MetricsKitTests
        - package: HealthTrackingModules/SleepMoodKitTests
    archive:
      config: Release
  HealthTrackingApp-Cloud:
    build:
      targets:
        HealthTrackingApp: all
    run:
      config: Cloud Debug
    archive:
      config: Cloud Release
